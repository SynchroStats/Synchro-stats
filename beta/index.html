<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><link rel=preconnect href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap' rel=stylesheet><title>SynchroStats</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0620;--card1:#17123c;--card2:#120d30;--bd:#241b52;--bd2:#15102f;--mut:#9a92c0;--pink:#ff5abe;--cyan:#06b6d4;--gold:#f5b301;--indigo:#6d5df6}
body{font-family:'Poppins',system-ui,sans-serif;background:radial-gradient(1200px 700px at 50% -8%,#1a1046 0,#0b0620 60%);background-attachment:fixed;color:#eceaf6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.flag{font-size:1.1em;vertical-align:-2px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 80px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,6,32,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.topin{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:26px}
.logo{font-weight:800;font-size:1.3rem}.logo b{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;margin-left:auto}
nav a{padding:8px 15px;border-radius:999px;font-weight:600;font-size:.86rem;color:#b9b2da}
nav a.on{background:linear-gradient(90deg,var(--pink),var(--cyan));color:#0b0620}
h1{font-size:2.6rem;font-weight:900;letter-spacing:-1.4px;margin:14px 0 4px}
h1 .em{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.note{color:var(--mut);font-size:.86rem;margin-bottom:6px}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 24px}
.chip{padding:9px 16px;border-radius:999px;font-weight:600;font-size:.82rem;background:#17123a;color:#b9b2da;border:1px solid #2a2156;cursor:pointer}
.chip.on{background:linear-gradient(90deg,var(--pink),var(--cyan));color:#0b0620;border:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px);border-color:#3a2d6e}
.bar{height:6px}.cbody{padding:16px 17px}
.row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.date{font-weight:700;font-size:.78rem;color:#0b0620;background:#eceaf6;padding:5px 11px;border-radius:999px}
.date.soon{background:var(--bd);color:var(--mut)}
.stp{font-size:.62rem;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:999px}
.stp.done{background:rgba(31,111,74,.35);color:#6ff0b0}.stp.soon{background:rgba(90,58,18,.5);color:#ffcf8f}
.nm{font-weight:800;font-size:1.08rem;line-height:1.12;margin:0 0 6px}
.loc{color:var(--mut);font-size:.78rem;display:flex;align-items:center;gap:6px;margin-bottom:12px}
.tpill{font-size:.56rem;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:6px;margin-left:auto}
.podwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--bd);padding-top:11px}
.pcol{min-width:0}.pcol+.pcol{border-left:1px solid var(--bd);padding-left:10px}
.plab{font-size:.56rem;font-weight:800;letter-spacing:1.2px;margin-bottom:6px}
.pr{display:flex;align-items:center;gap:6px;font-size:.78rem;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.pr b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.soonbox{border-top:1px solid var(--bd);padding-top:14px;color:var(--cyan);font-weight:700;font-size:.84rem}
/* detail / ranking tables */
.bc{color:var(--pink);font-weight:700;font-size:.82rem;margin:4px 0 16px;cursor:pointer;display:inline-block}.bc span{color:#5a5480}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--bd);padding-bottom:20px}
.hname{font-size:2.3rem;font-weight:900;letter-spacing:-1.2px;line-height:1;display:flex;align-items:center;gap:12px}
.hmeta{color:var(--mut);font-size:.92rem;margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.htag{font-size:.62rem;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:7px}
.catsw{display:flex;gap:9px;margin:24px 0 18px}
.ct{padding:9px 20px;border-radius:999px;font-weight:700;font-size:.9rem;background:#17123a;color:#b9b2da;border:1px solid #2a2156;cursor:pointer}
.ct.on{background:linear-gradient(90deg,var(--cyan),var(--indigo));color:#fff;border:none}
.sechd{font-size:.72rem;font-weight:800;letter-spacing:2px;color:#7a74a0;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
.sechd.sr{color:#ff9fd6}.sechd.jr{color:#7fe3f0}.sechd:after{content:'';flex:1;height:1px;background:var(--bd)}
.podiumHero{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-bottom:22px}
.pod{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--bd);border-radius:18px;padding:16px 12px;text-align:center}
.pod.win{padding:24px 12px;border-color:#5a4a1a;box-shadow:0 0 40px rgba(245,179,1,.12)}
.medal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin:0 auto 10px}
.pod.win .medal{width:56px;height:56px;font-size:1.6rem}
.pt{font-weight:800;font-size:1rem;margin-bottom:4px}.pod.win .pt{font-size:1.18rem}
.psc{color:var(--cyan);font-weight:800;font-size:1.05rem}.pod.win .psc{color:var(--gold);font-size:1.28rem}
table.rank{width:100%;border-collapse:collapse}
.rank th{font-size:.62rem;font-weight:800;letter-spacing:1px;color:#7a74a0;text-transform:uppercase;padding:0 10px 12px;text-align:center}.rank th.l{text-align:left}
.rank td{padding:8px 10px;border-top:1px solid var(--bd2);text-align:center}
.rkb{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--bd);color:#b9b2da}
.rkb.g{background:linear-gradient(135deg,#ffd76b,#f5a300);color:#3a2a00}.rkb.s{background:linear-gradient(135deg,#d6dae6,#9aa0b4);color:#2a2e38}.rkb.b{background:linear-gradient(135deg,#e8956b,#c56a3a);color:#3a1e0e}
.tm{font-weight:700;font-size:1rem;text-align:left;cursor:pointer}.tm:hover{color:var(--pink)}
.pill{display:inline-block;min-width:88px;padding:7px 10px;border-radius:11px;font-weight:800;font-size:.93rem;text-shadow:0 1px 2px rgba(0,0,0,.28)}
.pill i{font-style:normal;font-weight:600;font-size:.74rem;opacity:.85}.pill.none{background:#1b1540;color:#4a4470;text-shadow:none;font-weight:600}
.go{color:#4a4470;text-align:center;font-size:1.3rem;font-weight:700}
.hint{color:#6a6494;font-size:.8rem;margin:12px 0 0;text-align:center}
.nc{color:var(--mut);font-size:.9rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 24px}
.tile{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:16px 14px;text-align:center}
.tl{font-size:.6rem;font-weight:800;letter-spacing:1px;color:#7a74a0;margin-bottom:8px}.tv{font-size:1.7rem;font-weight:900;letter-spacing:-.5px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tcard{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:13px;transition:transform .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:#3a2d6e}
.tav{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--indigo));display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.tcn{font-weight:800;font-size:1rem}.tcm{color:var(--mut);font-size:.78rem;margin-top:2px}

function viewCalendar(){

function podiumHero(rows){const order=rows.length>=3?[1,0,2]:rows.map((_,i)=>i);

 const rows=c.cats[active]||[];
 h+=`<div class="sechd ${active==='Senior'?'sr':'jr'}">🥇 PODIUM · ${active.toUpperCase()}</div>${podiumHero(rows)}
 <div class="sechd ${active==='Senior'?'sr':'jr'}">FULL RANKING · ${active.toUpperCase()}</div>${rankTable(rows)}
 <div class=hint>› Tap a team to open its profile</div></div>`;
 app().innerHTML=h;
}

// ---------- RANKING ----------
function seasonTable(rows){rows=rows.slice(0,20);const n=rows.length,spR=segrank(rows,'SP'),fsR=segrank(rows,'FS');
 const pill=(v,rk,nn)=>!v?'<td><span class="pill none">—</span></td>':`<td><span class=pill style="background:${grad(rk,nn)};color:${rtxt(rk)}">${v.toFixed(2)} <i>(${rk})</i></span></td>`;
 const body=rows.map((r,i)=>{const rk=i+1,cls=rk===1?'g':rk===2?'s':rk===3?'b':'';
  return`<tr><td><span class="rkb ${cls}">${rk}</span></td><td class=tm onclick="go('#/team/${slug(r.n)}')"><span class=flag>${flag(r.nat)}</span> ${esc(r.n)}</td>
  <td class=nc>${r.nc}</td>${pill(r.SP,spR[i],n)}${pill(r.FS,fsR[i],n)}<td><span class=pill style="background:${grad(rk,n)};color:${rtxt(rk)}">${(r.T||0).toFixed(2)}</span></td></tr>`;}).join('');
 return`<table class=rank><thead><tr><th>#</th><th class=l>Team</th><th>Comps</th><th>Best SP</th><th>Best FS</th><th>Season Best</th></tr></thead><tbody>${body}</tbody></table>`;}
function viewRanking(){app().innerHTML=`<div class=wrap><h1>Season <span class=em>Ranking</span></h1>
 <div class=note>Teams ranked by their best SP + FS total of the season.</div>
 <div class="sechd sr">👑 SENIOR</div>${seasonTable(DATA.rank.Senior)}
 <div class="sechd jr">⭐ JUNIOR</div>${seasonTable(DATA.rank.Junior)}</div>`;}

// ---------- TEAMS ----------
function viewTeams(){
 const seen={},list=[];
 ['Senior','Junior'].forEach(cat=>DATA.rank[cat].forEach(r=>{const k=slug(r.n)+'|'+cat;if(seen[k])return;seen[k]=1;list.push({n:r.n,nat:r.nat,cat:cat,T:r.T});}));
 list.sort((a,b)=>a.n.localeCompare(b.n));
 const cards=list.map(t=>`<div class=tcard onclick="go('#/team/${slug(t.n)}')"><div class=tav>⛸️</div>
  <div><div class=tcn>${esc(t.n)}</div><div class=tcm><span class=flag>${flag(t.nat)}</span> ${t.nat} · ${t.cat}</div></div></div>`).join('');
 app().innerHTML=`<div class=wrap><h1><span class=em>Teams</span></h1><div class=note>${list.length} teams this season.</div><div class=tgrid style=margin-top:20px>${cards}</div></div>`;
}

// ---------- TEAM PROFILE ----------
function sparkline(vals,w=640,h=92){vals=vals.filter(v=>v);if(vals.length<2)return'';const lo=Math.min(...vals),hi=Math.max(...vals),rng=(hi-lo)||1;
 const pts=vals.map((v,i)=>[12+i*(w-24)/(vals.length-1),h-10-(v-lo)/rng*(h-24)]);
 const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const area=`12,${h-6} ${poly} ${w-12},${h-6}`;
 const dots=pts.map(p=>`<circle cx=${p[0].toFixed(1)} cy=${p[1].toFixed(1)} r=3.5 fill=#ff5abe />`).join('');
 return`<svg viewBox="0 0 ${w} ${h}" width=100% style=display:block><defs><linearGradient id=g x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color=#ff5abe stop-opacity=.35 /><stop offset=1 stop-color=#ff5abe stop-opacity=0 /></linearGradient></defs><polygon points="${area}" fill=url(#g) /><polyline points="${poly}" fill=none stroke=#ff5abe stroke-width=2.5 />${dots}</svg>`;}
function viewTeam(sl){
 // retrouver l'équipe + sa catégorie principale
 let name='',cat='',nat='';const rows=[];
 for(const c of DATA.comps){for(const ct of ['Senior','Junior']){const r=(c.cats[ct]||[]).find(x=>slug(x.n)===sl);if(r){name=r.n;nat=r.nat||nat;if(!cat)cat=ct;
   rows.push({d:c.d,c:c.n,p:c.p,t:c.t,SP:r.SP,FS:r.FS,T:r.T,ct:ct});}}}
 const mine=rows.filter(r=>r.ct===cat);
 if(!name){app().innerHTML='<div class=wrap>Team not found</div>';return;}
 const bSP=Math.max(0,...mine.map(r=>r.SP||0)),bFS=Math.max(0,...mine.map(r=>r.FS||0)),bT=Math.max(0,...mine.map(r=>r.T||0));
 const tiles=[['SEASON BEST',bT.toFixed(2),'#f5b301'],['BEST SP',bSP.toFixed(2),'#06b6d4'],['BEST FS',bFS.toFixed(2),'#ff5abe'],['COMPETITIONS',mine.length,'#b9acff']];
 const th=tiles.map(t=>`<div class=tile><div class=tl>${t[0]}</div><div class=tv style=color:${t[2]}>${t[1]}</div></div>`).join('');
 const hist=mine.map(r=>{const sp=r.SP?r.SP.toFixed(2):'—',fs=r.FS?r.FS.toFixed(2):'—';
  return`<tr><td class=nc style=white-space:nowrap>${esc(r.d)}</td><td class=tm style=cursor:default onclick="go('#/comp/')"><span class=flag>${flag(r.p)}</span> ${esc(r.c)}</td>
  <td class=nc>${sp}</td><td class=nc>${fs}</td><td><span class=pill style="background:linear-gradient(135deg,#201845,#17123a)">${(r.T||0).toFixed(2)}</span></td></tr>`;}).join('');
 app().innerHTML=`<div class=wrap><span class=bc onclick="go('#/teams')">‹ Teams <span>/ ${esc(name)}</span></span>
 <div class=hero style=border:none;padding-bottom:0><div class=hname><span class=flag>${flag(nat)}</span> ${esc(name)}</div></div>
 <div class=hmeta style=margin-bottom:6px><span class=htag style="background:rgba(255,90,190,.18);color:#ff9fd6">${cat.toUpperCase()}</span> ${nat} · Season 26/27</div>
 <div class=tiles>${th}</div>
 <div class=card style=cursor:default;padding:18px><div class=tl style=margin-bottom:8px>SEASON PROGRESSION · TOTAL</div>${sparkline(mine.map(r=>r.T))}</div>
 <div class=sechd>COMPETITION HISTORY</div>
 <table class=rank><thead><tr><th class=l>Date</th><th class=l>Competition</th><th>SP</th><th>FS</th><th>Total</th></tr></thead><tbody>${hist}</tbody></table></div>`;
}

// ---------- ROUTER ----------
function go(h){location.hash=h;}
function setnav(k){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));}
function route(){const h=location.hash||'#/';const m=h.match(/^#\/(\w+)?\/?(.*)$/);
 const part=(h.slice(2)).split('/');const head=part[0]||'';
 if(head==='comp'){setnav('cal');viewComp(part[1]);}
 else if(head==='ranking'){setnav('rank');viewRanking();}
 else if(head==='teams'){setnav('teams');viewTeams();}
 else if(head==='team'){setnav('teams');viewTeam(part[1]);}
 else {setnav('cal');viewCalendar();}
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script></body></html>
